[project]
name = "agent-orb"
version = "0.5.0"
description = "A voice assistant with drop-in panels for Claude Code and Copilot CLI."
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
    "aiohttp>=3.10",
 "markdown-it-py>=3",
 "numpy>=1.26",
]

[project.scripts]
orb = "orb.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2", "playwright>=1.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orb"]

[tool.pytest.ini_options]
testpaths = ["orb", "engines", "channel", "copilot"]
timeout = 60
